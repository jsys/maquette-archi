<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>maquette-archi</title>
  <meta name="description" content="Dessiner des plaques de carton à plat, puis les assembler en 3D par magnétisme.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/three.module.js",
        "three/addons/": "./lib/three/addons/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <a class="depot" href="https://github.com/jsys/maquette-archi" target="_blank" rel="noopener">github.com/jsys/maquette-archi</a>
    <label>Grille
      <select id="grille">
        <option value="1">1 mm</option>
        <option value="5">5 mm</option>
        <option value="10" selected>10 mm</option>
      </select>
    </label>
  </header>

  <aside id="panneau">
    <form id="nouvelle-plaque">
      <h2>Nouvelle plaque</h2>
      <div class="cotes">
        <label>Largeur <span><input name="largeur" type="number" min="1" max="2000" step="any" value="120" required> mm</span></label>
        <label>Hauteur <span><input name="hauteur" type="number" min="1" max="2000" step="any" value="80" required> mm</span></label>
      </div>
      <label>Matériau <select name="materiau"></select></label>
      <label>Épaisseur <span><input name="epaisseur" type="number" min="0.1" max="50" step="any" value="2" required> mm</span></label>
      <div class="choix" aria-label="Épaisseurs courantes"></div>
      <button type="submit">Créer la plaque</button>
    </form>
  </aside>

  <main id="vue3d">
    <form id="selection" class="flottant" hidden>
      <input name="nom" class="nom" aria-label="Nom de la pièce" autocomplete="off" spellcheck="false">
      <div class="cotes">
        <label>Largeur <span><input name="largeur" type="number" min="1" max="2000" step="any"> mm</span></label>
        <label>Hauteur <span><input name="hauteur" type="number" min="1" max="2000" step="any"> mm</span></label>
      </div>
      <label>Matériau <select name="materiau"></select></label>
      <label>Épaisseur <span><input name="epaisseur" type="number" min="0.1" max="50" step="any"> mm</span></label>
      <div class="choix" aria-label="Épaisseurs courantes"></div>
      <div class="actions">
        <button type="button" data-action="dupliquer" title="Dupliquer (⌘D ou Ctrl+D)">Dupliquer</button>
        <button type="button" data-action="supprimer" title="Supprimer (Suppr)">Supprimer</button>
      </div>
    </form>
  </main>

  <footer id="pieces">
    <span>Pièces</span>
    <ul></ul>
  </footer>
</body>
</html>
